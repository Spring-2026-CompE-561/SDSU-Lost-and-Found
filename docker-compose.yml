services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdsu-lost-found-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/sdsu_lost_and_found.db
    volumes:
      - backend_data:/app/data
      - ./backend/src:/app/src
    command: >
      uv run uvicorn app.main:app
      --reload
      --host 0.0.0.0
      --port 8000
      --app-dir src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdsu-lost-found-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  backend_data: